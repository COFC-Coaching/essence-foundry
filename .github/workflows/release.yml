name: Release

# Fires on any tag matching v*.*.* (e.g. v0.5.0). Push a tag to cut a release — nothing else
# to do by hand. Packs are already built and committed (see scripts/build-packs.mjs), so this
# workflow only needs to package what's already in the repo, not rebuild content from Neon.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches system.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION="$(node -p "require('./system.json').version")"
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match system.json version $MANIFEST_VERSION — update system.json first."
            exit 1
          fi

      - name: Package the system
        # system.json must sit at the ZIP ROOT (Foundry's installer unzips flat, it doesn't
        # expect a wrapping folder) — everything Foundry actually loads at runtime, and nothing
        # dev-only (Neon sync scripts, node_modules, CI config, package.json).
        run: |
          zip -r essence-system.zip \
            system.json module templates styles lang packs LICENSE README.md CHANGELOG.md \
            -x "packs/*/LOCK"

      - name: Create GitHub Release
        # system.json ships as its own asset, not just inside the zip: `manifest` points at
        # releases/latest/download/system.json, so the manifest a client checks and the zip it
        # then downloads are published in the same instant by the same tag. Pointing `manifest`
        # at main/system.json instead meant the two could disagree — between pushing the version
        # bump to main and pushing the tag, main advertised the new version while
        # releases/latest still served the previous zip, and any client checking in that window
        # would install the old build believing it was the new one. It was also served with a
        # five-minute CDN cache, which is why a client could be shown a version older than the
        # one it already had.
        uses: softprops/action-gh-release@v2
        with:
          files: |
            essence-system.zip
            system.json
          generate_release_notes: true
